name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run the deploy from the Actions tab without an empty commit —
  # useful the first time, if the repository was still private on the last push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress: a half-finished publish would leave the
# live site in an unknown state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Cheap gate: the engine tests need no dependencies, so this costs seconds
      # and stops an obviously broken calculator reaching the live site.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run engine tests before publishing
        run: node --test test/finance.test.js

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js finance.js .nojekyll _site/
          echo "Publishing:"
          ls -la _site

      # Pages must already be enabled with "GitHub Actions" as the source:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      #
      # This is a one-time manual step. configure-pages has an `enablement: true`
      # option that creates the Pages site over the API, but it fails with the
      # default GITHUB_TOKEN — that token's `pages: write` permission covers
      # deploying to an existing site, not creating one, which needs repo admin
      # rights. Using it would mean minting and storing a personal access token
      # purely to save a single click, so it is deliberately not used.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
