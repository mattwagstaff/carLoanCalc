name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run the deploy from the Actions tab without an empty commit —
  # useful the first time, if the repository was still private on the last push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress: a half-finished publish would leave the
# live site in an unknown state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Cheap gate: the engine tests need no dependencies, so this costs seconds
      # and stops an obviously broken calculator reaching the live site.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run engine tests before publishing
        run: node --test test/finance.test.js

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js finance.js .nojekyll _site/
          echo "Publishing:"
          ls -la _site

      # enablement: true switches GitHub Pages on via the API if it is not
      # already enabled, so there is nothing to click in repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
